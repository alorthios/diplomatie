name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: diplomatie
          POSTGRES_USER: diplomatie
          POSTGRES_PASSWORD: diplomatie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diplomatie"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE: "1"
          DATABASE_URL: postgres://diplomatie:diplomatie@localhost:5432/diplomatie

  docker:
    name: Image Docker et test de démarrage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Construire et lancer la stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Vérifier l'état de santé
        run: curl --fail --silent --show-error http://localhost:3000/healthz
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

# Lancement : cp .env.example .env && docker compose up -d
name: diplomatie

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diplomatie
      POSTGRES_USER: diplomatie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplomatie -d diplomatie"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-diplomatie:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://diplomatie:${POSTGRES_PASSWORD}@db:5432/diplomatie
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "${HTTP_PORT:-3000}:3000"

volumes:
  db-data:
